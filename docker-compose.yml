# One container. SQLite lives in ./data (or HG_DATA). No database username or password.
# The xAI key and admin password hash are sealed in .env.enc. Pass ENV_PASS at startup
# and the container unlocks them. No separate env file is required.
#
#   ENV_PASS='...' docker compose up -d --build
#
# The site is published on port 8110. The app inside the container still listens on 3000.
services:
  headline-guessr:
    build: .
    image: headline-guessr:latest
    container_name: headline-guessr
    ports:
      - "${HG_PORT:-8110}:3000"
    environment:
      DATA_DIR: /data
      NODE_ENV: production
      TZ: ${TZ:-America/New_York}
      ENV_PASS: ${ENV_PASS:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://headlineguessr.com}
    volumes:
      - ${HG_DATA:-./data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
