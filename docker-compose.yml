# One container. SQLite lives in ./data (or HG_DATA). No database username or password.
# Copy .env.example to .env and set XAI_API_KEY and ADMIN_PASSWORD_HASH before starting.
#
#   docker compose up -d --build
#
# The site listens on port 3000, or on HG_PORT if you set it.
services:
  headline-guessr:
    build: .
    image: headline-guessr:latest
    container_name: headline-guessr
    ports:
      - "${HG_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      NODE_ENV: production
      TZ: ${TZ:-America/New_York}
    volumes:
      - ${HG_DATA:-./data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
